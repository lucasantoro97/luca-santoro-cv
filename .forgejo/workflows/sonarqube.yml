name: SonarQube Server
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  sonar:
    if: ${{ vars.SONARQUBE_ENABLED == '1' && vars.SONAR_HOST_URL != '' }}
    runs-on: claude
    permissions:
      contents: read
    concurrency:
      group: sonarqube-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require SonarQube token
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: test -n "$SONAR_TOKEN"
      - name: Scan with SonarQube Server
        uses: https://github.com/SonarSource/sonarqube-scan-action@v5
        env:
          TAR_OPTIONS: --no-same-owner
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
